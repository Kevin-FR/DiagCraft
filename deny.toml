[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false

[licenses]
confidence-threshold = 0.8
include-dev = true
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0", "Unlicense", "0BSD"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Reviewed maintenance-only notices. No known vulnerability is exempted.
# Re-evaluate at each release; see docs/maintenance.md.
ignore = [
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz is transitive through usvg; upstream migration to harfrust tracked in ROADMAP.md" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive through egui and SVG/PDF; no compatible upstream replacement yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is transitive through Linux accessibility; awaiting upstream zbus 6 integration" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant is transitive through Linux accessibility; awaiting upstream zbus 6 integration" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is transitive through Linux accessibility; awaiting upstream zbus 6 integration" },
]
unsound = "all"

[bans]
multiple-versions = "allow"
wildcards = "deny"
