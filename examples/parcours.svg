<text text-anchor="middle" dominant-baseline="central" font-family="'Source Sans 3',Arial,sans-serif" font-size="16" fill="#848f99" font-weight="400" font-style="normal" text-decoration="none"><tspan x="640" y="123">Un parcours simple, prêt à devenir le vôtre.</tspan></text>
