[package]
name = "diagcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Native diagram editor"

[dependencies]
diagcraft.workspace = true
eframe.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
semver.workspace = true
rfd.workspace = true
image.workspace = true
arboard.workspace = true
resvg.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# eframe disables winit defaults. Enable its themed Wayland decorations instead
# of the dark, title-less fallback frame used by GNOME/Ubuntu without server-side decorations.
# Pin the existing winit version so both dependencies share one window backend.
winit = { version = "=0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[lints]
workspace = true
